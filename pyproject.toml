[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-pressure-lab"
version = "0.1.0"
description = "A bounded process memory-pressure probe"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
memory-pressure-lab = "memory_pressure_lab.__main__:main"

